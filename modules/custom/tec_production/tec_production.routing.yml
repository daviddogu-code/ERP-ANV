tec_production.sales_advance:
  path: '/tec_order/{tec_order}/advance'
  defaults:
    _controller: '\Drupal\tec_production\Controller\SalesStatusController::advance'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\tec_production\Controller\SalesStatusController::access'
    _csrf_token: 'TRUE'
    tec_order: \d+
  options:
    parameters:
      tec_order:
        type: 'entity:tec_order'

tec_production.queue:
  path: '/o/queue'
  defaults:
    _form: '\Drupal\tec_production\Form\ProductionQueueForm'
    _title: 'Orders on Queue'
  requirements:
    _permission: 'access tec production queue'

tec_production.log:
  path: '/production/log'
  defaults:
    _form: '\Drupal\tec_production\Form\ProductionLogForm'
    _title: 'Daily Production Log'
  requirements:
    _permission: 'register tec production'

tec_production.report:
  path: '/production/report'
  defaults:
    _controller: '\Drupal\tec_production\Controller\ProductionReportController::build'
    _title: 'Production Report'
  requirements:
    _permission: 'view tec production report'

tec_production.stock:
  path: '/stock'
  defaults:
    _form: '\Drupal\tec_production\Form\StockControlForm'
    _title: 'Stock Control'
  requirements:
    _permission: 'access tec stock control'

tec_production.stock_check:
  path: '/stock/check'
  defaults:
    _controller: '\Drupal\tec_production\Controller\StockCheckController::save'
  methods: [POST]
  requirements:
    _permission: 'access tec stock control'
    _csrf_request_header_token: 'TRUE'

tec_production.purchase_list:
  path: '/purchase'
  defaults:
    _form: '\Drupal\tec_production\Form\PurchaseListForm'
    _title: 'Purchase List'
  requirements:
    _permission: 'access tec purchase list'

tec_production.po_receive:
  path: '/tec_order/{tec_order}/receive'
  defaults:
    _form: '\Drupal\tec_production\Form\ReceiveForm'
    _title: 'Receive'
  requirements:
    # The custom check is what limits this to open purchase orders, and it is
    # also what hides the tab on sales orders: Drupal drops local tasks whose
    # route the user cannot reach.
    _custom_access: '\Drupal\tec_production\Form\ReceiveForm::access'
    tec_order: \d+
  options:
    parameters:
      tec_order:
        type: 'entity:tec_order'

# Settings live under Configuration rather than beside the /admin/tec screens.
# Those are bare paths with no menu entry anywhere, so a menu link pointing into
# that family would arrive with a breadcrumb leading nowhere. This is also the
# place an administrator looks first, and it gives the settings that come after
# this one -- currency, company address -- somewhere to go.
tec_production.admin_tec:
  path: '/admin/config/tec'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'TEC'
  requirements:
    _permission: 'administer tec company settings'

tec_production.company_settings:
  path: '/admin/config/tec/company'
  defaults:
    _form: '\Drupal\tec_production\Form\CompanySettingsForm'
    _title: 'Company settings'
  requirements:
    _permission: 'administer tec company settings'

# Under /supplier-orders and not under /purchase because it is the same family
# as the list of orders it chases, not a second version of the buying screen.
tec_production.purchase_queue:
  path: '/supplier-orders/queue'
  defaults:
    _form: '\Drupal\tec_production\Form\PurchaseQueueForm'
    _title: 'PO CONTROL'
  requirements:
    _permission: 'access tec purchase queue'

tec_production.purchase_queue_save:
  path: '/supplier-orders/queue/save'
  defaults:
    _controller: '\Drupal\tec_production\Controller\PurchaseQueueController::save'
  methods: [POST]
  requirements:
    _permission: 'access tec purchase queue'
    _csrf_request_header_token: 'TRUE'

tec_production.po_invoice:
  path: '/tec_order/{tec_order}/invoice'
  defaults:
    _form: '\Drupal\tec_production\Form\InvoiceUploadForm'
    _title: 'File invoice'
  requirements:
    # Same trick as the receive form: the custom check is what keeps sales
    # orders out, and Drupal then hides any link pointing here.
    _custom_access: '\Drupal\tec_production\Form\InvoiceUploadForm::access'
    tec_order: \d+
  options:
    parameters:
      tec_order:
        type: 'entity:tec_order'

tec_production.po_invoice_file:
  path: '/tec_order/{tec_order}/invoice/file'
  defaults:
    _controller: '\Drupal\tec_production\Controller\InvoiceDownloadController::download'
  requirements:
    _custom_access: '\Drupal\tec_production\Form\InvoiceUploadForm::access'
    tec_order: \d+
  options:
    parameters:
      tec_order:
        type: 'entity:tec_order'

# Hangs off the brand page and not off /b, because the brand it orders is the
# one you are looking at. The custom check is what limits it to brands: on any
# other vocabulary the route is forbidden and Drupal then hides the tab.
tec_production.brand_products:
  path: '/taxonomy/term/{taxonomy_term}/organize'
  defaults:
    _form: '\Drupal\tec_production\Form\BrandProductOrderForm'
    _title: 'Organize products'
  requirements:
    _custom_access: '\Drupal\tec_production\Form\BrandProductOrderForm::access'
    taxonomy_term: \d+
  options:
    parameters:
      taxonomy_term:
        type: 'entity:taxonomy_term'

tec_production.stock_adjust:
  path: '/stock/{taxonomy_term}/adjust'
  defaults:
    _form: '\Drupal\tec_production\Form\StockAdjustForm'
    _title: 'Adjust stock'
  requirements:
    _permission: 'access tec stock control'
    taxonomy_term: \d+
  options:
    parameters:
      taxonomy_term:
        type: 'entity:taxonomy_term'
