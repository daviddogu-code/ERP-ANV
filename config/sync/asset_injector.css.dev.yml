  /* FORMS */
  /* Sometimes fields need to be loaded in the GUI, i.e., to use prepopulate.
  We exclude them from view through the following rule */
  [id^="excluded"] {
      display: none;
  }

  /* MODAL DIALOG */
  .ui-widget-overlay {
