      max-width: 1080px;
  }

  @media (min-width: 767px) {
      .ui-dialog:not(.ui-dialog-off-canvas) {
          min-width: 800px;
      }
  }

  .ui-dialog {
      box-shadow: rgba(0, 0, 0, 0.4) 0px 30px 90px;
  }

  .ui-dialog .ui-dialog-titlebar {
      background: #fff;
      color: #000;
  }

  .ui-dialog .ui-dialog-title {
