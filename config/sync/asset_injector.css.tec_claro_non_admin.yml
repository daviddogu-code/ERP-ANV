    negate: false
    pages: "/admin/content/tec_product/*\r\n/tec_product/*/edit\r\n/tec_product/*/delete\r\n/tec_inventory/*/edit\r\n/tec_inventory/*/delete\r\n/admin/structure/taxonomy/manage/tec_inventory/*\r\n/admin/structure/taxonomy/manage/tec_patterns/*\r\n/taxonomy/term/*/edit\r\n/feed/*\r\n/bom/*/magic\r\n/admin/content/tec_inventory/add/tec_inventory_transaction\r\n/admin/structure/taxonomy/*\r\n/admin/*\r\n/tec_crm/*/edit\r\n/tec_crm/*/delete"
