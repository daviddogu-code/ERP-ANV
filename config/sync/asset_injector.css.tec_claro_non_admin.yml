id: tec_claro_non_admin
label: 'Claro non-admin'
code: |-
  /* Disables certain regions of Claro on certain paths, but not for Admins. */
  /* Claro resets */
  /* @TODO: debug the core issue */
  /* On ECK product entity edit, the fields mis-align */
  .js-form-item.form-item.js-form-type-select.form-type--select.js-form-item-field-tec-product-type.form-item--field-tec-product-type {
    margin-top: 0px;
      padding-top: 2px;
  }

  .content-header.clearfix {
      display: none;
  }

  /* FEEDS */
  .path-feed .form-type--vertical-tabs {
      display:none;
  }

  /* TAXONOMY */
  /* Removing relations */
  #edit-relations {
  	display: none;
  }

  /* VERTICAL TABS */
  .vertical-tabs {
  	display: none;
  }
media: all
