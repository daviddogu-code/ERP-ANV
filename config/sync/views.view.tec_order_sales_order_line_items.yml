%; text-align: right;\">\r\n            <table style=\"width: 100%; border-collapse: collapse;\">\r\n                <tr class=\"table-2-2-row-1\">\r\n                    <td class=\"table-2-2-row-1-col-1 table-cell\" style=\"text-align: right;\"><strong>SHIP TO:</strong><h5>Acta Non Verba Co., LTD.</h5>\r\n                        67, 29 Nongmaikaen Rd.<br>\r\n                        Muang Pattaya, Bang Lamung District, Chon Buri<br>\r\n                        20150 Thailand<br>\r\n                        Phone: +66 (0) 910 699 203</td>\r\n                </tr>\r\n            </table>\r\n        </td>\r\n    </tr>\r\n</table>"
