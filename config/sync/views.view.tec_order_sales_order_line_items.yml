          content: "<h4>BOXING ARTICLES AND EQUIPMENT</h4>\r\n<table style=\"width: 100%; border-collapse: collapse;\" class=\"table-3\">\r\n    <tr class=\"table-3-row-1\">\r\n        <td class=\"table-3-row-1-col-1 table-cell\" style=\"width: 25%;\"><h5>PRO FORMA</h5></td>\r\n        <td class=\"table-3-row-1-col-2 table-cell\" style=\"width: 25%;\">ORDER # {{ title }}</td>\r\n        <td class=\"table-3-row-1-col-3 table-cell\" style=\"width: 25%;\">DATE:</td>\r\n        <td class=\"table-3-row-1-col-4 table-cell\" style=\"width: 25%;\">{{ changed }}</td>\r\n    </tr>\r\n</table>\r\n\r\n<table class=\"table-2\">\r\n    <tr class=\"table-2-row-1\">\r\n        <td class=\"table-2-row-1-col-1 table-cell\"><strong>Company:</strong></td>\r\n        <td class=\"table-2-row-1-col-2 table-cell\">{{ field_tec_customer }}</td>\r\n        <td class=\"table-2-row-1-col-3 table-cell\"></td>\r\n        <td class=\"table-2-row-1-col-4 table-cell\"></td>\r\n    </tr>\r\n    <tr class=\"table-2-row-2\">\r\n        <td class=\"table-2-row-2-col-1 table-cell\"><strong>Address:</strong></td>\r\n        <td class=\"table-2-row-2-col-2 table-cell\">{{ field_tec_address_address_line1 }}<br>{{ field_tec_address_address_line2 }}</td>\r\n        <td class=\"table-2-row-2-col-3 table-cell\"></td>\r\n        <td class=\"table-2-row-2-col-4 table-cell\"></td>\r\n    </tr>\r\n    <tr class=\"table-2-row-3\">\r\n        <td class=\"table-2-row-3-col-1 table-cell\"><strong>PC/City:</strong></td>\r\n        <td class=\"table-2-row-3-col-2 table-cell\">{{ field_tec_address_postal_code }} {{ field_tec_address_locality }}</td>\r\n        <td class=\"table-2-row-3-col-3 table-cell\"><strong>Country:</strong></td>\r\n        <td class=\"table-2-row-3-col-4 table-cell\">{{ field_tec_address_country_code }}</td>\r\n    </tr>\r\n    <tr class=\"table-2-row-4\">\r\n        <td class=\"table-2-row-4-col-1 table-cell\"><strong>VAT ID:</strong></td>\r\n        <td class=\"table-2-row-4-col-2 table-cell\">{{ field_tec_tax_nr }} </td>\r\n        <td class=\"table-2-row-4-col-3 table-cell\"><strong>Phone nr.:</strong></td>\r\n        <td class=\"table-2-row-4-col-4 table-cell\">{{ field_tec_phone }}</td>\r\n    </tr>\r\n</table>"
          tokenize: true
      display_extenders:
        views_flag_refresh:
          flags:
            tec_eca_line_item_lock: tec_eca_line_item_lock
          noscrolltop: 0
      path: o/pf/%/print
