id: draft_for_ace_company_view
label: 'Draft for Ace company view'
code: |-
  jQuery(document).ready(function() {
      // Function to format numbers with commas as thousands separators
      function formatNumberWithCommas(number) {
          return number.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      }

      // Function to update the total for a row
      function updateRowTotal(row) {
          var priceText = row.find('.views-field-field-tec-price').text().trim();
          //console.log('Price text:', priceText);

          // Check if the price is empty
          if (!priceText) {
              row.find('.views-field-field-tec-line-item-total-number strong').text('฿ 0.00');
             // console.log('Price is empty, returning 0');
              return 0;
          }

          var price = parseFloat(priceText.replace(/[^\d.-]/g, ''));
         // console.log('Parsed price:', price);

          var quantityText = row.find('.views-field-form-field-field-tec-quantity input').val().trim();
         // console.log('Quantity text:', quantityText);

          // Check if quantity is empty
          if (!quantityText) {
              row.find('.views-field-field-tec-line-item-total-number strong').text('฿ 0.00');
             // console.log('Quantity is empty, returning 0');
              return 0;
          }

          var quantity = parseFloat(quantityText);
          //console.log('Parsed quantity:', quantity);

          if (isNaN(price) || isNaN(quantity)) {
             // console.log('Invalid price or quantity');
              row.find('.views-field-field-tec-line-item-total-number strong').text('฿ 0.00');
              return 0;
          }

          var total = price * quantity;
          //console.log('Row total:', total);

          row.find('.views-field-field-tec-line-item-total-number strong').text('฿ ' + formatNumberWithCommas(total.toFixed(2)));
          return total;
      }

      // Function to calculate the grand total and append it to the table
      function updateGrandTotal() {
          var grandTotal = 0;

          // Iterate over each row to calculate the grand total
          jQuery('.views-table tbody tr').each(function() {
              var row = jQuery(this);
              var rowTotal = updateRowTotal(row);
              grandTotal += rowTotal;
          });

          // Check if the grand total row exists, if not create it
          var grandTotalRow = jQuery('.grand-total-row');
          if (grandTotalRow.length === 0) {
              grandTotalRow = jQuery('<tr class="grand-total-row"><td colspan="8" class="views-align-right"><strong>Grand Total</strong></td><td class="views-align-right"><strong class="grand-total-value"></strong></td></tr>');
              jQuery('.views-table tbody').append(grandTotalRow);
          }

          // Update the grand total value
          grandTotalRow.find('.grand-total-value').text('฿ ' + formatNumberWithCommas(grandTotal.toFixed(2)));
          //console.log('Grand total:', grandTotal);
      }

      // Bind the keyup and change events to dynamically update totals
      jQuery(document).on('keyup change', '.views-field-form-field-field-tec-quantity input', function() {
          //console.log("Input changed");
          updateGrandTotal();
      });

      // Initial calculation of grand total on page load
      updateGrandTotal();
  });
     
