description: 'Where the goods are while they are on their way, which nothing in the ERP can work out on its own. Moved by hand on the purchase control screen, and empty until somebody moves it: an order nobody has chased yet reads Open. The three states that finish an order -- Delivered, Closed and Cancelled -- are not in here on purpose. They are read off the receipts, the invoice and the open/closed flag, so nobody can claim one of them without the facts behind it.'
